# Record of H22.md: status, prior, refuters, evidence. The status table in hypotheses/README.md is generated from it.
id: H22
status: CONTESTED
prior: 0.4
posterior: null
depends_on:
- H21
supports: []
contradicts_if:
- correlation with H21's head decision reaches rho >= 0.6 on shared-labelled overlap items -- this is the section's
  own declared 'important lock'; MEASURED 2026-08-20 at rho=-0.054 (see 2026-08-23 correction in evidence below)
  -- NOT triggered, this condition does not currently refute H22
- a bag-of-words/keyword classifier trained on the same labels matches or beats the WKV-state MLP head's F1 -- would
  mean the head isn't reading state geometry at all, just recovering surface lexical markers the labels were defined
  by
evidence:
- date: 2026-08-20
  file: hypotheses/H22.md
  call: contradicts
  strength: strong
  note: 'The v2 dataset (243 items) was mined via regex on exactly the surface phrases the classifier is then asked
    to detect: attributable = ''according to X (2020)'', ''X et al.''; unattributed = ''it is generally accepted'',
    ''most people believe''. Labels are DEFINED by lexical markers, so any classifier -- bag-of-words or WKV-state
    MLP -- is expected to score well; F1=0.947 doesn''t distinguish ''state encodes attribution as a semantic property''
    from ''state is a lossy proxy for which words were present, recovered via any channel''. Not a hidden bug, a
    design property of how the dataset was built -- flagged by the user as a live methodological question, unresolved.'
- date: 2026-08-20
  file: hypotheses/H22.md
  call: methodology
  strength: strong
  note: This section's own falsification criteria call distinctness from H21 'the important lock -- if H22 collapses
    into H19/H21 under measurement, the three-signal decomposition collapses to a two-signal one' (rho < 0.4 required,
    rho >= 0.6 = refuted). Prose below says this measurement is 'pending shared-labelled overlap items' -- never
    done. H22's standing as a distinct, non-redundant hypothesis is unverified by its own declared standard.
