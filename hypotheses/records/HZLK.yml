supports: []
contradicts_if:
- A loop trained over M>=2 ticks on a verified same-model teacher set does not beat both M=1 and M=0 on held-out
  items of at least two task families (paired by item, effect >= 5 points and McNemar p < 0.05 on the pooled items)
- 'At equal accuracy the trained loop still generates more than 80% of the teacher''s mean CoT tokens on the same
  items (G1i, untrained teacher: 470 on 32 patterns, 546 on 16 arithmetic items)'
- 'The loop never exceeds the teacher: after the stop and search stages (S3) it is below the teacher''s accuracy
  on every family at any token budget, i.e. distillation was all there was'
- The learned continue/stop action equals the best FIXED M, or collapses to the maximum M, on a mixed-family set;
  or a random stop with the same mean M does as well
- M>1 only works when a per-phase correctness reward is added (then self-regulation is not what produced it)
- A readout-level tuning (LoRA) that leaves routing unchanged nevertheless moves the state-noise basin by more than
  the seed-to-seed spread of the base model, i.e. output narrowness and the state are not separable
- Gains persist when the teacher's content is shuffled between examples, or when the fed expectation is swapped
  between examples (the loop is then fitting format, not extracting)
