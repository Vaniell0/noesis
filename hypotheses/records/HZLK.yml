# Record of HZLK.md: the programme's status, refuters, evidence and sub-claims. The table in HZLK.md is generated from `claims`.
# ZLK sub-claims: the source of the table in 'Sub-claims at a glance' (python experiments/regenerate_hyp_index.py).
# regime = the data and the model's state the status was measured in (pretrained vs from scratch).
# Sub-claims: `status` is one of PROPOSED, BLOCKED, REGULAR, PARTIAL, CONTESTED, SUPPORTED, REFUTED; the finding is the old free-word status; `after` names the sub-claims whose result it builds on (the edges of the graph).
id: HZLK
status: PROPOSED
prior: null
posterior: null
