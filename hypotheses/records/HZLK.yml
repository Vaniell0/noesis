claims:
- id: ZLK.1
  claim: CoT spends many tokens after the answer is already there
  status: PARTIAL
  finding: measured on one model, 47% of CoT tokens after the answer on 32 pattern items; the 16 arithmetic items
    save nothing
  regime: G1i 2.9B pretrained, 32 pattern items
- id: ZLK.2
  claim: untrained time (re-read, ticks, pauses) is not used
  status: REGULAR
  finding: regular; recall control not run
  regime: G1i 2.9B pretrained, untrained ticks and re-read
- id: ZLK.3
  claim: tuning narrows the output; the state survives it
  status: PARTIAL
  finding: partly measured
  regime: pretrained, LoRA readout tuning
- id: ZLK.4
  claim: a channel of the model's own latent can be trained without erasing the answer
  status: PARTIAL
  finding: '0.4B: tick no longer erases; every arm a pass-through'
  regime: G1d 0.4B pretrained
- id: ZLK.5
  claim: the model can learn to choose its own number of ticks
  status: PARTIAL
  finding: 'CONFIRMED on the toy 11-20 (2 of 3 seeds, sL_ramp1): own stop without a head equals fixed M8 at 62-69%
    of the ticks; seed 6 lost 0.10 to training'
  regime: toy from scratch (chase), start from a trained C model; pretrained not run
- id: ZLK.6
  claim: with search the loop exceeds its teacher's one-pass reading
  status: PROPOSED
  after:
  - ZLK.1
  finding: not run; bounded by T1/T2
  regime: ''
- id: ZLK.7
  claim: two views of one content land close without collapse
  status: PARTIAL
  finding: 'precondition measured 11-20: trained ticks raise cross-script state CKA without collapse (toy loop,
    3 seeds, 0.469 -> 0.625 at width 48, fading with width; 0.4B kl_T2_k4 +0.07 / +0.05; base-model M4 readings
    are untrained ticks, not evidence; other text 0.15-0.22); the trained term not run'
  regime: toy from scratch (two scripts); 0.4B pretrained, inference only
- id: ZLK.8
  claim: content first, format from the question; honest self-decisions
  status: PARTIAL
  finding: obedience measured, near 0
  regime: G1i 2.9B pretrained, silent answers
- id: ZLK.9
  claim: a persistent state absorbs the configuration once
  status: CONTESTED
  finding: H17, contested; H17 retired by decision 2026-11-24, so its refuter has no test behind it now
  regime: none measured (the owner's sessions)
- id: ZLK.10
  claim: an exact-recall branch queried at every tick keeps the past the settling state forgets
  status: PROPOSED
  regime: ''
- id: ZLK.11
  claim: a pretrained model holds facts it does not read in one pass
  status: PARTIAL
  finding: measured on Qwen3.5 0.8B; not on RWKV
  regime: Qwen3.5 0.8B pretrained
- id: ZLK.12
  claim: a trained reader raises usable capacity toward what is held
  status: PARTIAL
  after:
  - ZLK.11
  finding: 'supported in part 11-20: after 4 trained ticks (kl_T2_k4) a linear reader gets the next word at 0.177
    where the head gets 0.101 (head ahead without ticks, 0.373 vs 0.254): what the state holds exceeds what the
    head reads; T15 earlier: ticks +2% readable, training adds nothing; the 1.000 of the minimal pairs of 2026-10-20
    is kept under H22 (records/H22.yml), compatible with this claim, not a test of it'
  regime: G1d 0.4B pretrained (state readout; head vs reader, same target)
- id: ZLK.13
  claim: storage and reading trained together pack more at equal readability
  status: PROPOSED
  after:
  - ZLK.12
  finding: proposed; proved part for the state
  regime: ''
- id: ZLK.14
  claim: relations derived from held facts are usable knowledge the loop can add
  status: PROPOSED
  regime: ''
- id: ZLK.15
  claim: knowledge enters through a fixed teacher on the student's own tokens without breaking the rest
  status: PARTIAL
  finding: partly measured (Qwen)
  regime: Qwen3.5 0.8B pretrained
- id: ZLK.16
  claim: a loop learned from a plain pretrain beats the same chain grafted on a finished model
  status: PARTIAL
  after:
  - ZLK.12
  finding: 'toy form REFUTED 11-20 (1o: ticks grafted onto a one-pass toy pass k6 in 2 of 3 seeds, as reliable as
    grown); pretrained form not run'
  regime: toy from scratch (chase); pretrained not run
- id: ZLK.17
  claim: World trained by the chain against G1d compares two training methods from one base
  status: PROPOSED
  regime: ''
- id: ZLK.18
  claim: trained ticks widen the attractor instead of collapsing it, and the output grows more expressive
  status: PARTIAL
  after:
  - ZLK.4
  finding: 'one checkpoint supports it (kl_T2_k4); counter-case 11-21: 1t (100 full-weight steps on 160 Caesar rows,
    KL + GRPO, no pretraining CE beside it) broke the chat through its ticks (loops, refusals): the widening holds
    only with the pretraining term kept'
  regime: G1d 0.4B pretrained; long-distance regime
- id: ZLK.19
  claim: separability is installed by tasks that need it, not by an answer loss alone
  status: PARTIAL
  finding: 'P1 negative; toy: a task one pass cannot solve made the ticks a register, a per-hop target made the
    step iterable'
  regime: toy from scratch; P1 on G1d 0.4B
- id: ZLK.20
  claim: the neck of one-pass reading is the late fall of rank, where key interference is highest
  status: PARTIAL
  after:
  - ZLK.18
  finding: rank fall measured; interference not
  regime: G1d 0.4B and 2.9B pretrained
- id: ZLK.21
  claim: 'mixture of experts in time without a partition of the weights: each tick reads a view of the same weights,
    taken from its own latent'
  status: PROPOSED
  after:
  - ZLK.9
  - ZLK.20
  finding: not run
  regime: ''
- id: ZLK.22
  claim: loop training on a mix of domains folds them into one system that transfers to a held-out domain, below
    a specialist but smoother
  status: CONTESTED
  finding: 'toy 11-20: no transfer in bpc (1n plain/Cyrillic: joint +0.46 bpc vs Cyrillic-only, REFUTED; 1j plain+cipher
    -0.014), but the loop raises deep-layer CKA between scripts 0.44 -> 0.71; cs: the context step did not reach
    stored facts'
  regime: toy from scratch, 55K (1n) and 271K (1j), one seed each; pretrained not run
