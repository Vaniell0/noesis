- date: 2026-11-11
  file: hypotheses/H12.md
  call: methodology
  strength: strong
  note: Restated. One RWKV-7 step is a generalised delta-rule gradient step on a linear key->value map, so a head's
    state is a matrix trained in context. For such a memory the size n x n is a ceiling; recall is set by the overlap
    of the keys the weights produce for distinct items (crosstalk) and by decay (horizon). The measured numbers
    (recall 0.25 -> 0.02 between gap 60 and 229 at N=16; a drop between N=8 and 16 at fixed gap, n=10, exact match
    0 everywhere; 1-2 separable facts per head of 64 dims). The earlier summary 'recall 0.40 -> 0.02 between gap
    14 and 229' joined a cell of the width sweep with one of the distance sweep; corrected fit the interference
    reading; the direct estimator, overlap of the erase keys of stored items, is not run. The question moves from
    width vs decay to interference vs decay, and the multi-slot remedy is recorded as retired.
