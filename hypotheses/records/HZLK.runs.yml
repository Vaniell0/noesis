- run: 'closed-loop toy, phase A: stabilising the recipe (11-17)'
  model: chase C recipe (8 ticks, per-tick node target, curriculum), one knob at a time, 5 seeds
  setup: 'lr 1e-3 (base 3e-3) on the laptop; batch 256 (base 128) on the Aspire; gate: k = 6 >= 0.5 in 5 of 5 seeds'
  verdict: no knob gives 5 of 5; the stall rule REFUTED; the base recipe passes 14 of 15
  reading: 'k = 6 >= 0.5 by knob: base (lr 3e-3, batch 128) 6 of 7; lr 1e-3 1 of 5 (no seed collapses, k = 1 >=
    0.81, but 6000 steps undertrain: 0.59 / 0.47 / 0.47 / 0.40 / 0.33); batch 256 3 of 4 (seed 0, the base''s failure,
    now 0.95 at k = 6 and 0.96 at k = 8; seed 2 fails instead). No knob gives 5 of 5: the failure is a bad basin
    that moves between seeds. It is visible early: the per-tick loss at step 1500 is 0.43-0.52 in every failing
    or weak run (base s0, b256 s2, lr1e-3 s4) and 0.20-0.38 in every passing one, and the failing ones never fall
    after. A stall rule (per-tick loss > 0.40 at step 1500 -> restart with the next seed, report seeds tried) would
    have kept only passing runs here; it was a retrospective fit on 8 runs. Prospective test A3 (base recipe, seeds
    10-14 so far): all 5 pass k = 6 (0.81-0.99), but seeds 10 and 12 had loss 0.43 / 0.49 at step 1500 and recovered:
    the rule is wrong on 2 of 5, its refuter (>= 7 of 8 right) cannot be met: REFUTED. The base recipe itself now
    passes 11 of 12 seeds. A3 seeds 15-17 pass too (k = 6 0.84-0.90): base 14 of 15. A2, lr 1e-3 x 12000 steps:
    4 of 5 (seed 4 fails, 0.13): the slow rate was undertraining, not a fix for the bad basin'
  place:
  - experiments/A0_state_probe/results/closed_loop_toy/sA_*
- run: 'closed-loop toy, stage 1e: spatium rewrite derivations (11-17)'
  model: same toy, vocab +30 symbols; CE vs CE + owner's ZLK term (tick t -> EMA latent of hop t's term)
  setup: '33,985 items (29,987 train), 8 premises #1..#8 in context, ~140 tokens, depth 1..8, true/false 50/50 with
    near-miss falses; 6000 steps x 64, curriculum; seed 0'
  verdict: truth 0.90-0.98 at every depth; the ZLK term refuted on both answers over 3 seeds
  reading: 'On val_laws (held-out laws), M = 8: true items 0.90-0.98, false items 0.84-0.96 at every depth 1-8,
    both branches (exact BFS 0.99-1.00 at 55-4,347 terms expanded per item; the model spends 8 ticks). Mechanism
    (deriv_breakdown.py): falses are partly a shortcut, M = 0 already 0.72-0.82 on them and shuffled ticks keep
    0.79-0.97; trues need the ticks, M = 0 0.61-0.74 (CE) / 0.26-0.42 (ZLK) and shuffled ticks 0.45-0.73. ZLK refuter
    (ZLK - CE at depth 4-8 on val_laws >= +0.10): +0.004, refuted on seed 0, but at a 0.91 ceiling, so it decides
    little; ZLK moves more of the work into the ticks (its M = 0 trues 0.26-0.42 vs CE 0.61-0.74). Seed 1 replicates
    (depth 4-8 balanced at M = 8: CE 0.913, ZLK 0.938; seed 0: 0.914, 0.918): Seed 2: CE 0.951, ZLK 0.933. ZLK -
    CE on the truth answer +0.004 / +0.025 / -0.018 over 3 seeds: refuted by the letter, at a ceiling. last_rule
    variant (answer = local id of the last hop''s rule, true items only, chance 0.125), CE seed 0 final: val_laws
    M = 8 0.20-0.41 (depth 4-8 mean 0.27), M = 0 0.14-0.27, shuffled 0.17-0.29; val (seen laws) 0.19-0.40. The CE
    model names the last rule at about twice chance, far below its 0.91 truth accuracy: the truth answer rests mostly
    on a consistency check, not on a derivation it can report. ZLK last_rule seed 0: val_laws M = 8 0.37-0.50 (depth
    4-8 mean 0.448 vs CE 0.270), M = 0 0.07-0.17, shuffled 0.23-0.36; val 0.41-0.57. ZLK refuter (ZLK - CE at depth
    4-8 on val_laws >= +0.10) on the shortcut-proof answer: +0.18, CONFIRMED on seed 0; but CE seed 1 reaches 0.48
    at depth 4-8 (seed 0 was a weak CE seed), and ZLK seed 1 ends at 0.439: ZLK - CE = +0.18 / -0.04 on seeds 0
    / 1, not confirmed by the letter. Seed 2: CE 0.434, ZLK 0.295. Over 3 seeds ZLK - CE = +0.18 / -0.04 / -0.14,
    means 0.394 vs 0.395: the ZLK term (hop-term latent target) is REFUTED on the last_rule answer as on the truth
    answer; the seed-0 gain was seed noise (CE spread 0.27-0.48). Both arms name the last rule on held-out laws
    at about 3x chance (0.39 vs 0.125), so part of a derivation is there, with large seed variance. Label-free goal
    target (every tick toward the EMA latent of the goal term): seeds 0 / 1 0.46 / 0.362, mean 0.411 vs CE 0.395
    (+0.016, paired +0.19 / -0.12): refuted (<= +0.03). self (tick t toward the EMA copy''s tick t+1): 0.28 / 0.242,
    mean 0.261, below CE by 0.13: refuted, and it hurts (a target that rewards reaching the later state sooner pulls
    toward a fixed point). both (goal + self): 0.285 / 0.246, mean 0.266: refuted, self drags it down. Anonymised
    CE seed 0: 0.287 (plain CE seed 0: 0.27); seeds 1-2 running. The owner''s term (tick t predicts the latent of
    hop t''s term) is what lets the model name the rule it applied; on the truth answer it was hidden by the surface
    cue. cs seed 1 repeats seed 0 (chase 0.84-0.98 to k = 8, storage one-hop 0.24).'
  place:
  - experiments/A0_state_probe/results/closed_loop_toy/s1e_*
  - ~/tmp/toy/breakdown_s0.txt
- run: 'closed-loop toy, stage 1c: facts in the weights (11-16)'
  model: same toy, vocab +64 id tokens, 55,968 params
  setup: K fixed random 16-cycles named by two id tokens, no context; one-hop over all edges (capacity by Fano)
    and k-hop on held-out vs trained starts; 20000 steps x 256; seed 0
  verdict: one pass stores up to 1.46 bit/param; facts in the weights are not composed on unseen starts
  reading: 'One-pass capacity (A1, one-hop only): K 512 all edges (0.57 bit/param), K 1024 all edges, 64 kbit =
    1.14 bit/param, K 2048 0.81 of edges = 1.46 bit/param (highest), K 4096 0.37 = 0.66 (under-trained at ~80 exposures
    per edge). Composition: A with the curriculum (M = 0) answers k = 2 on TRAINED starts 0.97 but on held-out starts
    0.06 (chance): it memorises composites, the two-hop curse reproduced. C (8 ticks + per-hop target) at K 1024
    stores less (one-hop 0.60, 0.41 bit/param: the curriculum dilutes one-hop exposure) and also composes only trained
    starts (k = 2 0.99 seen, 0.06 held out). With facts in the state the loop composes (stage 1); with facts in
    the weights it did not, at this K and schedule. Refuter not applicable (one-hop < 0.9). C at K 2048 (105 min)
    stores almost nothing: one-hop 0.16 at M = 8, 0.04 bit/param, k = 2 on trained starts 0.72: with the curriculum
    and the per-hop target from step 0, storage starves as K grows. A at K 512 with the curriculum stores EVERY
    edge (0.9994) and still composes only trained starts (k = 2: 1.00 seen, 0.06 held out): for one pass the two-hop
    curse is not a storage shortfall. C at K 512 (8 ticks + per-hop target) also stores every edge (one-hop 0.999
    at M = 8) and composes trained starts (k = 2 1.00, k = 3 0.99) but not held-out ones (k = 2 0.07): refuter (ticks
    - M = 0 at k = 2 held out, one-hop >= 0.9) = +0.01, REFUTED on seed 0. A with a one-hop warm phase (Aw K 512):
