- run: training with ticks vs inverse lookup (11-13; order 0 trained, read pending)
  model: G1d 0.4B
  setup: 'v3 rows with the key plain->cipher ("A=ク", `--ladder-table plain_cipher`), whole answers (no pairs shown),
    seed 11, 1607 rows (every 20th held: 1526 / 81); CE on the gold pairs, full weights, Muon 1e-4, 300 steps x
    4 rows, CPU WKV chunked (logits within 0.01 of the per-token reference, so the base is read again on the same
    code); arm A trained at `M = 0`, arm B at `M = 4`, same rows and steps, three data orders (seeds 0-2) per arm;
    the rule reads the mean over orders and needs the same sign in all three. Read: `cipher_lookup --cl-formats
    row` on the 96 rung-0 rows of a separate set (seed 7), first_p50, each arm at its own `M` and at the other;
    base at both. Refuter written before the run, for the claim "training with ticks opens the inverse lookup beyond
    the same training without them": confirmed if B at `M = 4` minus A at `M = 0` >= +0.10 overall and in 2 of 3
    ciphers; refuted if <= +0.03 overall; between: a second seed; both arms <= 0.05: the budget decides nothing.
    My prediction: A opens it (the reverse pair can be written while "A=ク" is read), B about equal'
  verdict: inverse lookup learned without ticks from ~400-600 rows; order 0 trained, read pending
  reading: 'Order 0, in-training eval on the 81 held rows (exact answer): A at `M = 0` 0 / 0 / 0.63 / 0.98 / 1.0
    at steps 0 / 50 / 100 / 150 / 200; B 0 / 0 / 0.65 / 0.94 / 0.98, the same at `M = 0` and `M = 4` at every step.
    B stopped at step 215 (the machine froze 11-14); both arms keep a checkpoint at step 200 on the same order,
    so the read compares them there. The inverse lookup is learned without ticks from ~400-600 rows and holds on
    new keys; B trained through ticks and reads equally without them. Blind spot of the rule, found after training
    and before the read: the read set has the training cells (6 and 12 letters, rung 0), A sits at the ceiling,
    so "B - A >= +0.10" cannot happen; the read can refute only "ticks help where one pass already suffices"'
  place:
  - ~/tmp/inv/{A_M0,B_M4}_s0*
  note: logs and checkpoints; the read (results/train_inv_g1d04b_*_read_M*/) was not on this machine on 2026-11-23
- run: closed-loop toy from scratch, stage 1 (11-15)
  model: RWKV-7, 2 layers, width 48, 49.8K params, trained from scratch
  setup: pointer chasing in context over a 10-node cycle, k = 1..8 hops, query last; curriculum k_max 1 -> 8 over
    4500 of 6000 steps; CE on the answer only; A at `M = 0`, B-E at `M = 8` from step 0 (C per-tick JEPA target,
    D SIGReg 0.05, E both); seeds 0-2
  verdict: 'ticks buy depth: CONFIRMED (+0.74 / +0.74 / +0.78 at k = 3); SIGReg fails'
  reading: 'first run on record where ticks are not a pass-through: B 0.97 / 0.93 / 0.87 at k = 1 / 2 / 3 against
    A 0.78 / 0.16 / 0.13; B read at `M = 0` gives 0.00 at k = 1 (the computation lives in the ticks). k >= 4 at
    chance in both (B stalls at 3 hops though 8 ticks x 2 layers would allow more). Refuter 1 ("ticks buy depth",
    max(B..E) - A at k* + 2 = 3 >= +0.20, same sign in 3 seeds): +0.74 / +0.74 / +0.78, CONFIRMED. B is stable and
    stalls at 3 hops in all seeds (k = 3 0.85-0.93, k = 4 0.13-0.21). The per-tick terms break the wall but bimodally:
    C seeds 1-2 reach 0.92 / 0.88 at k = 4 and 0.83 / 0.72 at k = 8 / 7, C seed 0 only 0.35 at k = 3; D and E 1
    of 3 seeds past the wall (D s0 0.55 at k = 7, E s0 0.50 at k = 8), the other seeds never pass k = 1 (D s2 at
    chance even at k = 1). C seeds 3-6 (run by the spatium session): k = 6 0.70 / 0.92 / 0.91 / 0.83, so 6 of 7
    C seeds pass k = 6 >= 0.5 (seed 0 the only failure: its JEPA loss never falls, 0.46 -> 0.52, while seed 1''s
    falls 0.50 -> 0.12). Refuter 2 (C - B >= +0.10 at k > k* in all seeds, shuffle costs C >= 2x B): mean over k
    = 2..8 -0.10 / +0.51 / +0.38 against B; shuffle cost (tick input = another example''s latent, own state kept)
    over k = 2..8 is B 0.26 / 0.25 / 0.27, C 0.20 / 0.80 / 0.66 (seeds 4-6 0.83 / 0.82 / 0.80): 2x holds in every
    C seed but 0. Not confirmed by the letter (seed 0), not refuted. Reading: at k = 2..3, where both solve, the
    shuffle costs B 0.78-0.82 and C 0.81-0.87, so the per-example tick latent carries the computation in both arms
    (a register); the per-tick target does not create the register, it makes the step iterable past 3 hops. The
    2x clause is confounded by B''s wall. Bits per parameter (quant_sweep.py, per-row absmax rounding, `quant_s1.json`):
    at k = 1..3 B and C tolerate the same rounding (5 bits lossless, 4 bits -0.03 to -0.20, 3 bits about half lost);
    at k = 8 C loses more at 4 bits (0.82 -> 0.64, 0.89 -> 0.30), the rounding error accumulates over the ticks;
    the strict per-k minimum is B 5, C 5-8. The iterated step costs no more weight precision per step than the unrolled
    one, long chains need about one bit more. State probe (toy_state_probe.py, `state_probe_s1.json`; linear decode
    of every pair x -> next(x) from the WKV state after the pairs, held out): untrained 0.53, A 0.73 / 0.85 / 0.86,
    B 0.91 / 0.93 / 0.93, C 0.73 (failed seed 0) / 0.81 / 0.90 and seeds 4-6 0.96 / 0.96 / 0.95. Gate written before
    the run (tick arms >= +0.10 over M = 0 means the loop changed writing): B +0.11, C on its passing seeds +0.10,
    seeds 4-6 +0.13. The loop changed what is written, not only how it is read. Effective rank of the WKV heads
    (16 x 16, 10 pairs): untrained ~7-8, A 6-8 in layer 0, C seeds 4-6 3.5-4.6 in layer 0 with the best decode:
    the pairs are held more decodably in fewer dominant directions (ZLK.13 in miniature). After 8 ticks the rank
    stays 3.5-6.8, no collapse toward 1 as in the G1d attractor. Refuter 3 (SIGReg keeps the channel free without
    losing > 0.05): D loses > 0.05 at k <= 3 in 2 of 3 seeds, so at weight 0.05 it cannot pass; geometry not measured'
  place:
  - experiments/A0_state_probe/results/closed_loop_toy/s1_*
- run: 'closed-loop toy, stage 1b: affine cipher seen through runs (11-16)'
  model: same toy, C recipe (M = 8, per-tick target), A (M = 0), and a chase + affine mix
  setup: 4 runs x -> a x + b mod 16 in context, query not among them; seeds 0-1 of 3
  verdict: a rule from runs not learned; the shift is won only past its closed form (k >= 6)
  reading: 'not learned: k = 1 0.27-0.29 (C) and 0.35-0.48 (A), above chance 0.06 but far from the rule (parity
    of the runs explains part). A design flaw: odd a mod 16 has order <= 4, so E^4 is the identity in 64 of 128
    ciphers and E^8 in 96; A''s 1.00 at k = 8 and 0.75 at k = 4 are that shortcut, not depth. In the mix the affine
    half stays at chance and drags the chase half (seed 0 walls at 3 hops). Refuter "the loop applies a rule inferred
    from runs" not met (k = 3 at M = 8 0.25-0.28 < 0.5): inferring a and b from runs is out of reach at 50K params
    and 6000 steps; the iterated depth was not tested because of the shortcut (seed 2 the same: k = 1 0.25-0.33).
    Shift rung (11-16, E(x) = x + b mod 13, b != 0, no power shortcut): the rule is inferred from the runs perfectly,
    C at M = 8 1.00 at every k = 1..8 in all three seeds (M = 0 read of it 0.00-0.40); A at M = 0 1.00 up to k =
    5, then 0.97 / 0.52 / 0.97 at k = 6 and 0.52 / 0.12 / 0.72 at k = 8. Refuter as written not met on its M = 0
    side (A 1.00 at k = 3): a shift has a closed form, x + k b, which one pass computes without iterating; the ticks
    win only where the closed form''s arithmetic fails (k >= 6). Depth tasks for the loop need no closed form (tables,
    derivations)'
  place:
  - experiments/A0_state_probe/results/closed_loop_toy/s1b_*
