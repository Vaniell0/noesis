# Record of H25.md: status, prior, refuters, evidence. The status table in hypotheses/README.md is generated from it.
id: H25
status: PARTIAL
prior: null
posterior: null
depends_on:
- H8
supports: []
contradicts_if:
- Post-RL MLP probe on mathematical prompts shows no increase in nonlinear state content vs pre-RL (no new dimensions
  activated for coefficient structure) -- pattern-matching, not state-substrate computation
- Accuracy on linear equations with out-of-distribution coefficients does not exceed random baseline -- weight memorisation,
  not generalised computation
- Zeroing L16 WKV state at answer token does not degrade accuracy -- state is not causally read
evidence:
- date: 2026-08-23
  file: experiments/A0_state_probe/micro_wkv.py
  call: supports
  strength: weak
  note: 'Toy-scale, staged-supervision multiplication task (operand a at step 0, b only at final step, frozen final
    readout closing the readout-bilinearity shortcut), default (Adam) optimizer. With every alternative path closed,
    forcing a_gate=0 (erase-rewrite off) collapses R² from 0.9998/0.8361 (id/OOD) to -0.0810 -- the delta-rule mechanism
    is necessary for THIS solution. Weak version (WKV as programmable register) cleanly demonstrated. Strength downgraded
    strong->weak 2026-09-03: this necessity result is Adam-solution-specific, not an architecture-level fact --
    see the same-day Muon entry below, which found a different, equally-valid solution to the identical task that
    does NOT depend on a_gate. The real G1i checkpoint was pretrained with Muon, not Adam -- this toy result''s
    relevance to the real model''s actual mechanism is unclear until re-checked against that.'
- date: 2026-08-23
  file: experiments/A0_state_probe/results/muon_vs_adam_multiseed.json
  call: methodology
  strength: weak
  note: 'Same FrozenFinalReadoutController multiplication task, retrained with Muon (hidden net.*.weight only) instead
    of Adam, 5 seeds. Both optimizers solve the task equally well (id_r2 near-identical), but the a_gate=0 ablation
    diverges sharply: Adam -1.376+-1.326 (heavily dependent on the erase-rewrite channel, every seed), Muon -0.029+-0.032
    (barely dependent on it at all, every seed). Same task, same architecture, same accuracy, reliably DIFFERENT
    mechanism depending on which optimizer found the solution -- directly limits the entry above''s ''necessary''
    claim to Adam-found solutions specifically, not a task/architecture-level necessity. Real G1i was pretrained
    on Muon (per user, 2026-09-03) -- if pretrain-optimizer determines which mechanism a solution relies on the
    way this toy result suggests, the real model plausibly resembles the Muon solution (distributed reliance across
    channels) rather than the Adam one (concentrated on one channel), which was not accounted for when this section''s
    evidence entries were first drafted.'
- date: 2026-08-24
  file: experiments/rl/results/wkv_linear_probe_v3_step500.json
  call: supports
  strength: weak
  note: 'Real checkpoint (g1i_zlk_phase1_v3_step500), not toy. Held-out linear probe on WKV state at L12/16/20 for
    4-bit XOR: full-integer target undecodable (R²=-0.02), but 3 of 4 individual bits carry real held-out signal
    (bit1 0.31, bit2 0.11, bit3 0.27). Toy-scale clean register behaviour does not transfer cleanly to the real
    ThinkChain-trained checkpoint -- partial, not null, not clean.'
- date: 2026-08-25
  file: experiments/rl/results/counterfactual_decay_v3_step500.json
  call: neutral
  strength: weak
  note: 'fleeb83''s own proposed discriminator (alter layer-12 decay at the final think-tick, check whether downstream
    layers 13-31 follow the naive-predicted shift or a trained interpreter robustly ignores it), run on the real
    checkpoint. corr(actual_shift, naive_predicted_shift)=0.8806, mean |residual|/mean |shift| ~=14%. Downgraded
    supports->neutral 2026-09-03: originally read as graded partial physics-delegation, but this doesn''t cleanly
    discriminate given the entry above -- if the real (Muon-pretrained) model spreads computation across many redundant
    channels rather than concentrating it in decay specifically, perturbing ONE channel (layer-12 decay) would produce
    exactly this kind of partial, graded, neither-clean-delegation-nor-clean-robustness response for an ordinary
    redundancy reason, unrelated to fleeb83''s level-1-vs-level-2 distinction. fleeb83 himself does not treat his
    own result as proof (see 2026-08-21 entry below) -- this entry should not be read as stronger than he reads
    it. Does not resolve the weak/strong question; a channel-ablation sweep across MULTIPLE decay channels at once
    (not just L12) would better distinguish ''partial delegation in one channel'' from ''redundant distributed reliance''
    -- not yet run.'
- date: 2026-08-21
  file: hypotheses/H25.md
  call: methodology
  strength: weak
  note: 'fleeb83''s own pushback (email correspondence): his 48/48 symbolic result demonstrates WKV as a programmable
    working register (weak version) but NOT that the model deliberately exploits the physics of the recurrence itself
    as a coprocessor (strong version) -- proposed the counterfactual-altered-recurrence test as the actual discriminator
    between the two readings, which is what the 2026-08-25 entry above ran for real. Recorded here as the source
    of the weak/strong distinction this whole record is organised around, not as evidence for or against either
    reading.'
- date: 2026-09-04
  file: experiments/A0_state_probe/results/parity_pause_token_g1i_toy.json
  call: supports
  strength: weak
  note: 'WKV-native replica of arXiv 2505.21024''s pause-token expressivity result (parity task, toy scale, ParityController
    in micro_wkv.py). Held-out accuracy: n_extra=0 -> 0.882, n_extra=1 -> 0.980, n_extra=2 -> 1.000, n_extra=4 ->
    0.941, n_extra=8 -> 0.980 -- real jump from adding silent loop steps, not noise-sized. First version of this
    test was flawed (bits revealed one per step gave the recurrence free depth regardless of n_extra) and was corrected
    same day before trusting the result. Weak strength because the effect, while real and directionally consistent
    with the formal separation result, is much smaller than that paper''s clean impossible-vs-possible separation
    -- WKV''s n_extra=0 baseline (0.88) is nowhere near chance, unlike the 2-layer Transformer''s total failure
    without pause tokens, so this doesn''t establish a comparably sharp expressivity boundary for this architecture
    yet.'
- date: 2026-09-02
  file:
  - experiments/A0_state_probe/results/muon_vs_adam_toy.json
  - experiments/A0_state_probe/results/muon_vs_adam_lr_sweep.json
  call: methodology
  strength: weak
  note: 'Precursor runs to the 2026-08-23 muon_vs_adam_multiseed.json entry above: the single-seed cheap test (muon_vs_adam_toy.json)
    and the muon_lr tuning sweep (id_r2 falling monotonically as muon_lr increases from the default 0.02, per docs/rl-track.md)
