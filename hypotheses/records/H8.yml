- date: 2026-09-04
  file: experiments/A0_state_probe/results/ipc_diverse_input_g1i.json
  call: neutral
  strength: weak
  note: 'Tests the standing IPC methodology worry directly: does the project''s convention (single fixed PROMPT
    + GREEDY self-generated continuation) understate true channel capacity vs. a genuinely diverse, teacher-forced
    continuation? Real G1i checkpoint, CPU, 96 tokens each. Deep layers (4/16/27/31): IPC_total=0.000 for BOTH greedy
    and diversified, no change -- the near-zero deep-layer result is ROBUST to this specific confound, not an artifact
    of narrow self-generated input. L0 moved the OPPOSITE direction from what the ''suppressed capacity'' theory
    predicted: greedy=1.609, diverse=0.160 (10x LOWER, not higher). Token-level check explains why: the greedy continuation
    is only 49/96 unique tokens with a visible repeating template motif (''28352,43,3340,X,4955,285,296,Y'' recurring
    with only X/Y varying) -- a highly regular, low-entropy sequence that a linear held-out regression can fit easily,
    plausibly inflating L0''s greedy number as a redundancy artifact rather than genuine richer channel use. The
    diversified text (75/96 unique tokens, curated cross-topic sentences) is a harder, more realistic regression
    target and scores lower for a mundane reason unrelated to model capacity. Two separate findings, opposite implications:
    deep-layer IPC≈0 gets MORE trustworthy (confound ruled out); L0''s greedy number gets LESS trustworthy (likely
    inflated by decode degeneracy) -- don''t cite either number without this caveat going forward.'
