- date: 2026-09-04
  file: experiments/A0_state_probe/results/ipc_diverse_input_g1i.json
  call: supports
  strength: weak
  note: 'Ran 2026-09-04, first read 2026-09-13 -- the result sat unopened for nine days. Tests whether the near-zero
    IPC on G1i is a property of the state or an artifact of the model''s own narrow self-generated input distribution:
    same probe, greedy self-continuation vs. teacher-forced diverse real text. Greedy L0 IPC_total = 1.609/16; diverse
    L0 = 0.1597/16. Deep layers (4/16/27/31) are 0.0 in BOTH conditions. So IPC does NOT rise on a more varied input
    -- it drops tenfold, and the greedy number was the inflated one (the model''s own continuation is visibly repetitive
    in the saved token ids, and repetition is trivially linearly reconstructible). Kills the ''the model starves
    its own channel by emitting monotonous markers'' explanation for low IPC as stated: with genuinely diverse input
    the linear decodability is worse, not better, and the deep-layer zeros are not a distribution artifact. Consistent
    with the existing reading that the state encodes nonlinearly rather than buffering tokens.'
- date: 2026-09-13
  file: experiments/A0_state_probe/results/rank_recheck/jlens.json
  call: methodology
  strength: strong
  note: 'CORRECTION to how this file''s own state-spectrum numbers have been read. Several entries here (and rich/rlens
    entries above) cite stable_rank ~1.2 as showing the state uses essentially one direction. That inference does
    not follow: stable_rank is an energy-concentration ratio, and a matrix with one dominant singular value plus
    31 real ones scores ~1.03 (pinned in experiments/A0_state_probe/test_jlens_spectrum.py). jlens_probe.py now
    also reports entropy-effective rank, participation ratio and a count of directions above 1% of sigma1, and keeps
    the per-head distribution instead of averaging 40 heads away -- the data-quality gap this log already flagged
    twice (''jlens emitted no summary again''). Re-measured on G1i base: 13-16 live directions of 64 (per-head range
    3-28), entropy-rank 6-7. The state is superposed, not collapsed. Breadth builds through L4-L20 and narrows sharply
    at L24 (8.4 directions, entropy-rank 3.60) immediately before readout; width and strength are near-independent
    across heads (corr 0.30 at L4 -- noted but NOT an intervention point: RWKV-7''s ln_x is nn.GroupNorm(n_head,
    n_embd), so each head is its own normalisation group and reaches the mixer at unit variance regardless of sigma1;
    quiet-wide heads are equalised, not ignored). Interpretation and what it implies for the M axis are in docs/effort-frontier.md,
    not duplicated here -- this entry exists so the stale ''near rank-1'' reading does not keep standing in this
    log as if verified.'
