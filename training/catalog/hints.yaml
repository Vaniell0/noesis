# Facts a file scan cannot see. Consumed by `training/datasets.py backfill`;
# the records in this directory are the source of truth afterwards (hand edits
# to them survive a re-run). Only write here what is documented — a field left
# out is an honest gap. Evidence entries cite the document that holds the number.
#
# verdict vocabulary: helped | hurt | no-effect | failed | unsound | confirmed | untested

