# ---- external sources we intend to use, not downloaded (facts from the 2026-10-06 web search) --------
# Everything here was read from search results / abstracts; licences marked "check" were not confirmed.
_planned:
  - name: flores200
    role: payload
    origin: "Meta NLLB: 3001 sentences from 842 Wikimedia articles, professionally translated into ~200 languages (fully parallel)"
    url: https://huggingface.co/datasets/facebook/flores
    license: CC-BY-SA-4.0
    notes: "Share-alike carries to anything derived from it (cipher payloads included). It is also an MT benchmark: check which splits are held out before using any as training payload."
  - name: tatoeba
    role: payload
    origin: "Tatoeba: volunteer-translated example sentences; the multilingual benchmark covers 112 languages with up to 1000 English-aligned pairs each"
    url: https://www.manythings.org/corpus/about.html
    license: CC-BY-2.0-FR
    notes: "Full database sizes per language not measured yet; measure on download. Quality is volunteer-grade."
  - name: udhr_unicode
    role: payload
    origin: "Universal Declaration of Human Rights in Unicode: 419 translations (project count from search); one identical text in every language"
    url: https://www.unicode.org/udhr/
    license: "check on download"
    notes: "Small (one document) but exactly parallel: the cheapest multilingual payload and a clean cross-language 'same content' view."
  - name: mtob_kalamang
    role: eval
    origin: "MTOB (Tanzer et al., ICLR 2024): learn Kalamang <-> English from one grammar book; <250K tokens English, <25K tokens Kalamang; word list; 375 paired sentences. Kalamang (<200 speakers) is held out of the web."
    url: https://arxiv.org/abs/2309.16575
    license: "check on download"
    languages: [kalamang, english]
    notes: "A real 'language nobody knows'. Reported: Gemini 1.5 Pro (1M context) 59.1 chrF vs 57.0 for the first author; other LLM baselines ~45. Needs a long context: the natural test for a state that reads a book."
  - name: lingoly
    role: eval
    origin: "LINGOLY: 1,133 Linguistics-Olympiad puzzles, 90+ mostly low-resource languages, 6 formats, 5 difficulty levels, with a no-context baseline that penalises memorisation (best model 38.7% on hard)"
    url: https://arxiv.org/abs/2406.06196
    license: "check on download"
    notes: "Rule induction from a few examples with a built-in memorisation control: the closest published relative of our matrix tasks."
  - name: swissdial
    role: eval
    origin: "SwissDial: parallel spoken Swiss German in 8 dialects (AG, BE, BS, GR, LU, SG, VS, ZH) with High German transcripts, ~3 h audio per dialect, 26 h total; Grisons ~3x over-represented"
    url: https://www.researchgate.net/publication/350311158_SwissDial_Parallel_Multidialectal_Corpus_of_Spoken_Swiss_German
    license: "check on download"
    languages: [swiss-german, german]
    notes: "Text side only is needed here. Swiss German has no standard spelling, so the checkable ground truth is the Standard German side. One content, eight dialect 'formats' = natural view pairs."
  - name: sds200
    role: eval
    origin: "SDS-200: 189 h Swiss German speech with Standard German text translations"
    url: https://aclanthology.org/2022.lrec-1.347.pdf
    license: "check on download"
    languages: [swiss-german, german]
  - name: archimob
    role: eval
    origin: "ArchiMob: spoken Swiss German oral-history interviews, dialectal and normalised transcription"
    url: http://www.lrec-conf.org/proceedings/lrec2016/pdf/801_Paper.pdf
    license: "check on download"
    languages: [swiss-german]
  - name: scots_wikipedia
    role: negative-control
    origin: "Scots Wikipedia: ~49% of the entries (20,000+) were written by one US editor who did not speak Scots, by grafting words from an online dictionary onto English sentences"
    url: https://en.wikipedia.org/wiki/Scots_Wikipedia
    license: CC-BY-SA-4.0
    languages: [scots]
    notes: "Not ground truth for Scots. Its worth is as a NEGATIVE control: does a model prefer fake Scots (English grammar + Scots words) over real Scots? Real-Scots sources still to be found and checked."
