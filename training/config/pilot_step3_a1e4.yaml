# Step 3, alpha=1e-4, full corpus, fast chunks.
# alpha reduced from 1e-3 after observing state explosion on 7k-rollout run:
# state_loss grew 365x in 22 opt-steps → total went negative, CE dominated.
# Fix: (1) 10x smaller alpha, (2) full corpus prevents fast CE saturation,
# (3) per-layer state_loss clamped at -10 in compute_state_reg.
#
# ctx_len=2048, chunk_ctx=512 → 4 trajectory points/layer, T_chunks≥3 → OK.
# Speed: ~0.81 it/s → 61933/0.81/3600 ≈ 21h for full corpus.

model:
  checkpoint: ~/.libs/models/rwkv7/rwkv7-g1d-0.4b/rwkv7-g1d-0.4b.pth
  ctx_len: 2048
  dtype: bf16
lora:
  rank: 16
  alpha: 32
  target_modules: [receptance, key, value]
  dropout: 0.0
optimizer:
  name: adamw
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  grad_accum_steps: 8
  batch_size: 1
training:
  epochs: 1
  chunk_ctx: 512
corpus:
  tokenized_pt: training/tokenised/glaive_v2_train.pt
state_reg:
  mode: trajectory_reg
  alpha: 1.0e-4
  lambda_delta: 1.0
  lambda_curvature: 1.0
  work_layers: [12, 16, 20]
logging:
  run_dir: training/runs
  run_name: pilot_g1d_glaive_v2_step3_a1e4
