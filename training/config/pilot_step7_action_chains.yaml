# Step 7 — action chains only (clean corpus, no ToolBench)
#
# Corpus: action_chains_train.pt (1.3 GB, 1134 sessions)
#   - Claude Code action chains only: 10–70 tool_use per session
#   - Supervised: ~78% tokens (tool_use turns only)
#   - ctx_len=2048: first 2048 tokens per session (~1.8M supervised tokens)
#
# Why action chains only:
#   - ToolBench (step6) → 0/48 eval, <tool_call>/<tool_response> format bleeding
#   - Action chains are own sessions: clean license, high reflexive density
#   - 1134 sessions × 2.4h/epoch ≈ 9 epochs in 24h VM window
#
# Base: G1h 2.9B (start from ORIGINAL base, NOT step6 checkpoint)

model:
  checkpoint: /root/.libs/models/rwkv7/rwkv7-g1h-2.9b-20260710-ctx10240.pth
  ctx_len: 16384
  dtype: bf16
  n_layer: 32
  n_embd: 2560

lora:
  rank: 16
  alpha: 32
  target_modules: [receptance, key, value]
  dropout: 0.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 50
  grad_accum_steps: 8
  batch_size: 1

training:
  epochs: 1
  chunk_ctx: 512

corpus:
  tokenized_pt: training/tokenised/action_chains_train.pt

state_reg:
  mode: trajectory_reg
  alpha: 1.0e-3
  lambda_delta: 1.0
  lambda_curvature: 1.0
  work_layers: [4, 16, 20]

logging:
  run_dir: training/runs
  run_name: pilot_g1h_step7_action
  save_steps: 35  # optimizer steps (= ~250 micro-batches ≈ 22% epoch); grad_accum=8
