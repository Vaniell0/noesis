# Step 6 — mixed reflexive corpus (action chains + ToolBench ReAct)
#
# Corpus: step6_mixed_train.pt
#   - Claude Opus action chains: 1134 sessions, 63M supervised tokens (78%)
#   - ToolBench G123-DFS: 183k rollouts, 23M supervised tokens (13%)
#   - Combined: 253M total, 86M supervised (34.1%)
# Loss mask: tool_use tokens only — behavior cloning on action decisions.
# Base: G1h 2.9B (10.4% A0 genuine baseline, best available).
#
# Key differences vs Steps 1-5 (glaive-v2):
#   - Reflexive corpus: 10-70 tool_use per session, causal dependencies
#   - Correct architectural class for RWKV WKV state accumulation
#   - H2 first valid test: reasoning-first on multi-step sequences
#   - ToolBench adds API-domain diversity to action-chain backbone

model:
  checkpoint: /root/.libs/models/rwkv7/rwkv7-g1h-2.9b-20260710-ctx10240.pth
  ctx_len: 2048
  dtype: bf16
  n_layer: 32
  n_embd: 2560

lora:
  rank: 16
  alpha: 32
  target_modules: [receptance, key, value]
  dropout: 0.0

optimizer:
  name: adamw
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  grad_accum_steps: 8
  batch_size: 1

training:
  epochs: 1
  chunk_ctx: 512

corpus:
  tokenized_pt: training/tokenised/step6_mixed_train.pt

state_reg:
  mode: trajectory_reg
  alpha: 1.0e-3
  lambda_delta: 1.0
  lambda_curvature: 1.0
  work_layers: [12, 16, 20]

logging:
  run_dir: training/runs
  run_name: pilot_g1h_step6_mixed
  save_steps: 250
