#        --rfcs training/corpus/rfc_binary/ \
#        --out training/corpus_open/rfc_qa.jsonl
#    python training/tokenize_rollouts.py \
#        --input training/corpus_open/rfc_qa.jsonl \
#        --out-train training/tokenised/step9_rfc_train.pt \
#        --out-val training/tokenised/step9_rfc_val.pt \
#        --format plain_cot  # NOT DSL
#
# 2. Generate self-CoT corpus from step8 checkpoint:
