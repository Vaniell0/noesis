# Pilot LoRA config — Variant C hybrid primary anchor, α=0 baseline.
#
# 2026-07-30 (Variant C hybrid): fine-tune signal is
# `training/tokenised/glaive_v2_train.pt` (61,934 rollouts, 11.8M
# tokens, 19.7% supervised) from glaiveai/glaive-function-calling-v2
# (Apache-2.0). Personal Claude CLI corpus is retrieval-only,
# permanently out of weights per CLAUDE.md hard constraint. See
# `docs/policies.md § A1 fine-tune corpus scope`,
# `training/README.md §Corpus policy`, and
# `~/.claude/plans/verdant-anchoring-heron.md`.
#
# xlam-function-calling-60k is a gated dataset on HF and requires an
# access token; when available, run `normalize_xlam.py` + retokenize
# a mixed corpus and update `corpus.tokenized_pt` below.
#
# Values mirror the design decisions in
# `~/.claude/plans/verdant-anchoring-heron.md § Step 4`.
# `training/lora_train.py` exposes StateCapture + train_step
# primitives; full Lightning-driven training goes through
# `training/train_pilot.py` which monkey-patches
# `light_rwkv.RWKV.training_step` before delegating to the vendored
# `train.py`.

model:
  # Cached checkpoint at ~/.libs/models/rwkv7/rwkv7-g1d-0.4b — smallest
  # pilot target. Middle target is 1.5B (Design §1).
  checkpoint: "~/.libs/models/rwkv7/rwkv7-g1d-0.4b/rwkv7-g1d-0.4b.pth"
  ctx_len: 4096
  dtype: "bf16"

lora:
  # Micro-pilot config: rank 16 keeps params low ($5-10 budget, 10-14h
  # on 4090 spot). Full A1 tune bumps to rank 32.
  rank: 16
  alpha: 32
  target_modules: ["receptance", "key", "value"]  # RWKV-PEFT default surface
  dropout: 0.0

optimizer:
  name: "adamw"
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  grad_accum_steps: 8
  batch_size: 1

training:
  # 1 epoch on 62k rollouts ≈ 8k grad-updates at accum=8. Sufficient for
  # the micro-pilot signal (Variant C falsifier: does action-cloning move
  # the substrate at all?). Full A1 bumps to 3 epochs.
  epochs: 1
  eval_every_steps: 1000
  ckpt_every_steps: 500
  early_stop_val_no_drop_by_steps: 500  # abort if no improvement by 500 steps

corpus:
  # Variant C hybrid primary — glaive-v2 tokenised via tokenize_rollouts.py.
  # Val split is deterministic hash-based (val_pct=2).
  tokenized_pt: "training/tokenised/glaive_v2_train.pt"
  val_tokenized_pt: "training/tokenised/glaive_v2_val.pt"
  val_fraction: 0.0        # split already baked into separate .pt
  a02_eval_path: "experiments/A0_eval/tasks.jsonl"

# State-reg hook. A0.5 PASS on all three sub-tests (verdict.md) locked
# the branch: trajectory_reg with A0.5-derived layer weights
# (see state_reg.py::_A05_ZERO_LAYER_KL). alpha=0 leaves the hookup wired
# but makes total loss == CE (state_reg branch short-circuits early).
#
# Pilot bring-up plan:
#   1. mode=off, alpha=0.0                   — baseline CE loss curve, no
#      state capture, no hook overhead.
#   2. mode=trajectory_reg, alpha=0.0        — sanity: state hooks fire, CE
#      curve identical to step 1 (proves capture is non-invasive).
#   3. mode=trajectory_reg, alpha=1e-3..1e-1 — sweep to find the value
#      that lifts bit_book_05 (variable-length prefix code) without
#      regressing extraction. Start low; state_reg motion+curvature terms
#      are unnormalised and can dominate CE at alpha ~= 1.
state_reg:
  mode: "off"
  alpha: 0.0
  lambda_delta: 1.0
  lambda_curvature: 1.0
  # A0.5-sampled layers with above-floor KL. For a 24-layer target the
  # default sample set is {12, 16, 20}; empty here so state_reg.py's
  # default_layer_weights kicks in unmodified.
  work_layers: []

logging:
  run_dir: "training/runs"
  run_name: "pilot_g1d_glaive_v2_a0"
